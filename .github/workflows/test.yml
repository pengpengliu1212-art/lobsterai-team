name: lobsterai-team CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Smoke tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Force LF line endings (per WSL2 / unix build server best practice 2026)
          # Without this, Windows-pushed files get CRLF and bash fails with '\r' errors
          lfs: false

      - name: Force LF line endings on all scripts
        run: |
          # Normalize line endings (fixes Windows CRLF → unix LF)
          find . -type f \( -name "*.sh" -o -name "*.ps1" -o -name "*.cmd" -o -name "*.py" \) -exec dos2unix {} \; 2>/dev/null || true
          # If dos2unix not available, use sed fallback
          find . -type f \( -name "*.sh" -o -name "*.ps1" -o -name "*.cmd" -o -name "*.py" \) -exec sed -i 's/\r$//' {} \;
          echo "Line endings normalized"

      - name: Verify Docker available
        run: docker --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make bash scripts executable
        run: |
          chmod +x install.sh bin/lobster-team
          ls -la install.sh bin/lobster-team

      - name: Install lobsterai-team (headless, skip dashboard)
        run: ./install.sh --skip-dashboard --skip-skill-link

      - name: Build custom role images (devops, data)
        run: |
          docker build -t lobsterai-team-devops:latest ./images/devops
          docker build -t lobsterai-team-data:latest ./images/data

      - name: Pre-create workspace root for role sandboxes
        run: |
          # sandbox_exec.sh mounts \$WORKSPACE_HOST (defaults to \$HOME/software-dev-Lob).
          # On CI runners that path doesn't exist; create it so docker volume mount succeeds.
          mkdir -p "$HOME/software-dev-Lob"
          # On CI use the repo checkout as the workspace so any role commands that need
          # access to repo files can read them.
          echo "WORKSPACE_HOST=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Verify CLI version
        run: ./bin/lobster-team version

      - name: Verify CLI status (--json + parse)
        run: |
          ./bin/lobster-team status --json > /tmp/status.json
          python3 -c "import json; d=json.load(open('/tmp/status.json')); assert d['team_root']; print('status OK')"

      - name: Debug - direct docker run
        run: |
          echo "DEBUG: WORKSPACE_HOST=${WORKSPACE_HOST:-<unset>}"
          echo "DEBUG: GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-<unset>}"
          echo "DEBUG: HOME=${HOME:-<unset>}"
          echo "DEBUG: workspace dir contents:"
          ls -la "${WORKSPACE_HOST:-$HOME/software-dev-Lob}" 2>&1 | head -5 || true
          echo "DEBUG: docker version:"
          docker version --format '{{.Server.Version}}' 2>&1 || echo "DEBUG: docker daemon not reachable"
          echo "DEBUG: trying direct docker run:"
          docker run --rm --read-only --tmpfs /tmp:rw,size=200m --cap-drop=ALL --network=bridge \
            -v "${WORKSPACE_HOST:-$HOME/software-dev-Lob}:/workspace:rw" \
            -w /workspace \
            python:3.12-alpine python3 --version 2>&1 || echo "DEBUG: direct docker run failed with $?"

      - name: Smoke test - lobster-pm
        run: |
          set +e
          echo "TRACE: WORKSPACE_HOST=${WORKSPACE_HOST:-<unset>}"
          echo "TRACE: PATH=$PATH"
          echo "TRACE: pwd=$(pwd)"
          echo "TRACE: ls bin/:"
          ls -la bin/ 2>&1 | head -5
          echo "TRACE: ls skills/lobster-pm/:"
          ls -la skills/lobster-pm/ 2>&1 | head -10
          echo "TRACE: ls skills/lobster-pm/scripts/:"
          ls -la skills/lobster-pm/scripts/ 2>&1
          echo "TRACE: python3 -V:"
          python3 -V 2>&1
          echo "TRACE: which python3:"
          which python3 2>&1 || true
          echo "TRACE: running ./bin/lobster-team run lobster-pm python3 --version"
          ./bin/lobster-team run lobster-pm python3 --version 2>&1
          rc=$?
          echo "TRACE: exit=$rc"
          exit $rc
      - name: Smoke test - lobster-architect
        run: ./bin/lobster-team run lobster-architect python3 --version
      - name: Smoke test - lobster-coder
        run: ./bin/lobster-team run lobster-coder node --version
      - name: Smoke test - lobster-qa
        run: ./bin/lobster-team run lobster-qa node --version
      - name: Smoke test - lobster-devops
        run: ./bin/lobster-team run lobster-devops cat /etc/alpine-release
      - name: Smoke test - lobster-data
        run: ./bin/lobster-team run lobster-data python3 --version

      - name: Verify role allowlist (rejection test)
        run: |
          if ./bin/lobster-team run "../bad" python3 --version 2>&1 | grep -q "unknown role"; then
            echo "PASS: role allowlist rejected bad role"
          else
            echo "FAIL: role allowlist did not reject bad role"
            exit 1
          fi

      - name: Verify init path safety (rejection test)
        run: |
          if ./bin/lobster-team init "/etc" 2>&1 | grep -q "refusing to init"; then
            echo "PASS: init path safety rejected /etc"
          else
            echo "FAIL: init path safety did not reject /etc"
            exit 1
          fi

      - name: Verify install idempotency (run 3x)
        run: |
          for i in 1 2 3; do
            echo "--- run $i ---"
            ./install.sh --skip-dashboard --skip-skill-link | tail -5
          done
          echo "PASS: install idempotent across 3 runs"

      - name: Verify sandbox security flags (docker inspect)
        run: |
          docker run -d --rm --name ci-test --read-only --tmpfs /tmp:rw,size=200m \
            --cap-drop=ALL --cpus=2 --memory=2g --pids-limit=256 \
            --network=bridge \
            -v "$GITHUB_WORKSPACE:/workspace:rw" \
            -w /workspace \
            alpine:latest sleep 30
          sleep 2
          CAPS=$(docker exec ci-test cat /proc/self/status | grep CapEff | awk '{print $2}')
          echo "Effective capabilities: $CAPS (expect 0000000000000000 for full drop)"
          if [ "$CAPS" = "0000000000000000" ]; then
            echo "PASS: all caps dropped"
          else
            echo "FAIL: caps not fully dropped: $CAPS"
            docker stop ci-test
            exit 1
          fi
          docker exec ci-test sh -c "touch /should-fail.txt 2>&1" || echo "PASS: root read-only"
          docker stop ci-test

  test-windows:
    name: Smoke tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify PowerShell + Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          $PSVersionTable.PSVersion

      - name: Verify lobster-team.ps1 (Windows wrapper)
        shell: pwsh
        run: ./bin/lobster-team.ps1 version

      - name: Verify --version flag
        shell: pwsh
        run: ./bin/lobster-team.ps1 --version

      - name: Verify --help
        shell: pwsh
        run: ./bin/lobster-team.ps1 --help

      - name: Verify role allowlist
        shell: pwsh
        run: |
          # Use Start-Process with explicit stdout/stderr redirection (most reliable
          # way to capture child process output across PowerShell / runner versions).
          $tmpOut = [System.IO.Path]::GetTempFileName()
          $tmpErr = [System.IO.Path]::GetTempFileName()
          $p = Start-Process -FilePath "python" `
                              -ArgumentList @("-u", "bin\lobster_team\__main__.py", "run", "../bad", "python3") `
                              -RedirectStandardOutput $tmpOut `
                              -RedirectStandardError $tmpErr `
                              -NoNewWindow -Wait -PassThru
          $stdout = Get-Content -Raw $tmpOut
          $stderr = Get-Content -Raw $tmpErr
          Remove-Item -Force $tmpOut, $tmpErr
          $content = $stdout + $stderr
          if ($content -match "unknown role") {
            "PASS"
          } else {
            "FAIL: stdout=$stdout stderr=$stderr exit=$($p.ExitCode)"
            exit 1
          }