name: lobsterai-team CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Smoke tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Force LF line endings (per WSL2 / unix build server best practice 2026)
          # Without this, Windows-pushed files get CRLF and bash fails with '\r' errors
          lfs: false

      - name: Force LF line endings on all scripts
        run: |
          # Normalize line endings (fixes Windows CRLF → unix LF)
          find . -type f \( -name "*.sh" -o -name "*.ps1" -o -name "*.cmd" -o -name "*.py" \) -exec dos2unix {} \; 2>/dev/null || true
          # If dos2unix not available, use sed fallback
          find . -type f \( -name "*.sh" -o -name "*.ps1" -o -name "*.cmd" -o -name "*.py" \) -exec sed -i 's/\r$//' {} \;
          echo "Line endings normalized"

      - name: Verify Docker available
        run: docker --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make bash scripts executable
        run: |
          chmod +x install.sh bin/lobster-team
          ls -la install.sh bin/lobster-team

      - name: Install lobsterai-team (headless, skip dashboard)
        run: ./install.sh --skip-dashboard --skip-skill-link

      - name: Verify CLI version
        run: ./bin/lobster-team version

      - name: Verify CLI status (--json + parse)
        run: |
          ./bin/lobster-team status --json > /tmp/status.json
          python3 -c "import json; d=json.load(open('/tmp/status.json')); assert d['team_root']; print('status OK')"

      - name: Smoke test all 6 expert roles
        run: |
          set +e
          FAIL=0
          for role in lobster-pm lobster-architect lobster-coder lobster-qa lobster-devops lobster-data; do
            echo "--- $role ---"
            case $role in
              lobster-pm|lobster-architect) ./bin/lobster-team run "$role" python3 --version ;;
              lobster-coder|lobster-qa) ./bin/lobster-team run "$role" node --version ;;
              lobster-devops) ./bin/lobster-team run "$role" cat /etc/alpine-release ;;
              lobster-data) ./bin/lobster-team run "$role" python3 --version ;;
            esac
            if [ $? -ne 0 ]; then
              echo "FAIL: $role"
              FAIL=$((FAIL+1))
            fi
          done
          if [ $FAIL -gt 0 ]; then
            echo "REGRESSION: $FAIL role(s) failed"
            exit 1
          fi
          echo "PASS: all 6 roles ran"

      - name: Verify role allowlist (rejection test)
        run: |
          if ./bin/lobster-team run "../bad" python3 --version 2>&1 | grep -q "unknown role"; then
            echo "PASS: role allowlist rejected bad role"
          else
            echo "FAIL: role allowlist did not reject bad role"
            exit 1
          fi

      - name: Verify init path safety (rejection test)
        run: |
          if ./bin/lobster-team init "/etc" 2>&1 | grep -q "refusing to init"; then
            echo "PASS: init path safety rejected /etc"
          else
            echo "FAIL: init path safety did not reject /etc"
            exit 1
          fi

      - name: Verify install idempotency (run 3x)
        run: |
          for i in 1 2 3; do
            echo "--- run $i ---"
            ./install.sh --skip-dashboard --skip-skill-link | tail -5
          done
          echo "PASS: install idempotent across 3 runs"

      - name: Verify sandbox security flags (docker inspect)
        run: |
          docker run -d --rm --name ci-test --read-only --tmpfs /tmp:rw,size=200m \
            --cap-drop=ALL --cpus=2 --memory=2g --pids-limit=256 \
            --network=bridge \
            -v "$GITHUB_WORKSPACE:/workspace:rw" \
            -w /workspace \
            alpine:latest sleep 30
          sleep 2
          CAPS=$(docker exec ci-test cat /proc/self/status | grep CapEff | awk '{print $2}')
          echo "Effective capabilities: $CAPS (expect 0000000000000000 for full drop)"
          if [ "$CAPS" = "0000000000000000" ]; then
            echo "PASS: all caps dropped"
          else
            echo "FAIL: caps not fully dropped: $CAPS"
            docker stop ci-test
            exit 1
          fi
          docker exec ci-test sh -c "touch /should-fail.txt 2>&1" || echo "PASS: root read-only"
          docker stop ci-test

  test-windows:
    name: Smoke tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify PowerShell + Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          $PSVersionTable.PSVersion

      - name: Verify lobster-team.ps1 (Windows wrapper)
        shell: pwsh
        run: ./bin/lobster-team.ps1 version

      - name: Verify --version flag
        shell: pwsh
        run: ./bin/lobster-team.ps1 --version

      - name: Verify --help
        shell: pwsh
        run: ./bin/lobster-team.ps1 --help

      - name: Verify role allowlist
        shell: pwsh
        run: |
          $r = ./bin/lobster-team.ps1 run "../bad" python3 2>&1
          if ($r -match "unknown role") { "PASS" } else { "FAIL"; exit 1 }
